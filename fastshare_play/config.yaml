name: FastShare Play
slug: fastshare_play
version: "2.0.2"
description: Local movie library, three automatic previews, NOVA resume and browser playback
url: https://github.com/Jirkas-prog/fastshare-play
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ports:
  8098/tcp: null
ports_description:
  8098/tcp: Playback web without sign-in (managed in the app settings)
panel_icon: mdi:movie-open-play
panel_title: FastShare Play
hassio_api: true
hassio_role: default
map:
  - type: media
    read_only: true
  - type: share
    read_only: true
options: {}
schema: {}
